<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="side1">
      <div class="odin">
        <img style="height: 100px;" src="odin-lined.png">
        <p style="  color: white;font-size:70px;">ODIN</p>
      </div>
      <footer style="color: white; font-size: x-small; text-align: center; ">Photo by Haile West on Unsplash</footer>
    </div>
    <div class="side2">
      <div class="note">
        <p>
          <strong style="font-weight: 700;">This is not a real online service! You know you need somthing like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</strong>
        </p>
        <p><strong style="font-weight: 700;">You <em>know</em> you want to.</strong></p>
      </div>  
      <div class="theForm">
        <div class="idk">
          <form action="#" method="post">
          <p style="font-size: x-large; font-weight: 700;">Let's do this!</p>
          <div class="names">
            <div class="input-group">
              <label for="firstName">FIRST NAME</label>
              <input id="firstName" name="firstName" type="text" minlength="3" required>
              </div>
            <div class="input-group">
              <label for="lastName">LAST NAME</label>
              <input id="lastName" name="lastName" type="text" minlength="3" required >
            </div>
          </div>
          <div class="address">
            <div class="input-group">
              <label for="email">EMAIL</label>
              <input id="email" name="email" type="email" required>
              </div>
            <div class="input-group">
              <label for="number">PHONE NUMBER</label>
              <input id="number" name="number" type="text" required>
            </div>
          </div>
       <div class="password">
            <div class="input-group">
              <label for="password">PASSWORD</label>
              <input id="password" name="password" type="password" minlength="8">
            </div>
            <div class="input-group">
              <label for="confirmPassword">CONFIRM PASSWORD</label>
              <input id="confirmPassword" name="confirmPassword" type="password">
            </div>
         </div>
        </div>
        <button type="submit" class="signup">Create Account</button>
       <p style="margin-left: 40px;">Already have an account?<a href="https://www.youtube.com/watch?v=5KVDDfAkRgc" style=" color: #596D48; border: none; font-size: 17px; font-family: 'Roboto'">Log in</a></p>
      </div>
        </form>
    </div>
  </div>
  <script src="sign.js"></script>
</body>
</html>
